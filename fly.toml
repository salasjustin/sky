# Required secrets (fly secrets set; names only, never values here):
#   SKY_API_KEY              bearer key for /v1 and /mcp, >=32 token68 chars: openssl rand -hex 32
#   WEBHOOK_SIGNING_KEY      HMAC key for outbound webhooks, >=32 chars: openssl rand -hex 32
#   SECRET_ENCRYPTION_KEY    AES-256 key, base64 of 32 bytes: openssl rand -base64 32
#   SPRITES_TOKEN            Sprites API token, from the user's Sprites org
#   CLAUDE_CODE_OAUTH_TOKEN  runner auth for Claude Code, from the user's `claude setup-token`; the default credential
# Optional secrets (the README's "Claude credentials" explains them):
#   CLAUDE_OAUTH_TOKEN_<NAME>  another subscription's token, named by <NAME> (CLAUDE_OAUTH_TOKEN_PERSONAL is "personal")
#   SKY_ANTHROPIC_API_KEY      a pay-per-use Anthropic API key, the fallback while an environment's subscription is at its limit

app = "sky-justin"            # placeholder: app name chosen at deploy
primary_region = "sin" # placeholder: region code chosen at deploy, e.g. "iad"

# Fly's default is SIGINT; the API drains only on SIGTERM, and as PID 1 it ignores unhandled signals
kill_signal = "SIGTERM"
# >= the runner long-poll hold in apps/api/src/app.ts; open SSE streams outlast it unless the app closes them
kill_timeout = 30

[env]
  DATA_DIR = "/data"
  # how a sprite reaches this API; host must match `app` above
  PUBLIC_BASE_URL = "https://sky-justin.fly.dev"

# single machine + single volume: the SQLite file is one unreplicated copy, so the volume needs snapshots
[mounts]
  source = "sky_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
