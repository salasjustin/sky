name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      # No `version:` input — the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # the bundle the image runs, built as the Dockerfile builds it; a crash on start fails here
      - run: pnpm --filter '@sky/api...' build
      - run: ci/boot-check.sh
        timeout-minutes: 5

  # the image itself: its entrypoint, uid, ENV, runtime better-sqlite3 install and migrations
  image-boot:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: sky-api:boot-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ci/image-boot-check.sh sky-api:boot-check
        timeout-minutes: 3
