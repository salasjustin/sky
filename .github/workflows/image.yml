name: Image

on:
  # deploys a main commit only after CI has passed on it, and never over a newer commit already running
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # a manual run redeploys main's tip, and refuses it unless CI passed on that commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # repeats the job's `if:`: the group binds before it, and under workflow_run github.ref is always main, so a
  # failed, cancelled, pull-request or fork CI run would otherwise join deploy-sky and cancel the deploy pending there
  group: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'deploy-sky' || github.run_id }}
  # one deploy runs while at most one waits, a newer run replacing the waiting one; each re-reads what is
  # running before it builds
  cancel-in-progress: false

jobs:
  image:
    # deploys prod and pushes the hardcoded :main tag, so a pull request's CI run, a failed CI run, a run of a
    # fork's or another branch's commit and a manual run from another branch must not get this far
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      # lets a manual run list CI's runs for the commit
      actions: read
    env:
      # the commit CI checked, not whatever main points at when this run starts
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require a passing CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --event push --branch main \
            --commit "$DEPLOY_SHA" --json conclusion --jq 'any(.[]; .conclusion == "success")')"
          if [[ "$passed" != "true" ]]; then
            echo "::error::CI has not passed on ${DEPLOY_SHA::7}, the tip of main; nothing deployed. Wait for CI or fix it, then run again."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # the guard below asks git whether the running commit descends from DEPLOY_SHA
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          # the guard reads `flyctl image show --json`; a fixed version keeps that output's shape stable
          version: 0.5.3
      # an older passing CI run can be re-run after newer commits deployed, and must not roll the app back.
      # A running tag that isn't a sha- tag, or names a commit this repository doesn't have, can't be shown
      # to be newer, so it deploys; a failed read fails the job rather than guessing, and a re-run settles it
      - name: Skip if the app already runs this commit or a newer one
        id: guard
        # an explicit bash adds pipefail, so a failed flyctl fails the step instead of jq's exit 0 deploying
        shell: bash
        run: |
          tag="$(flyctl image show -a sky-justin --json | jq -r '.[0].Tag // ""')"
          deploy=true
          if [[ ! "$tag" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "The app runs tag '${tag}', not a sha- tag, so its age can't be told: deploying ${DEPLOY_SHA::7}."
          elif ! running="$(git rev-parse --verify --quiet "${tag#sha-}^{commit}")"; then
            echo "The app runs ${tag}, a commit this repository doesn't have, so its age can't be told: deploying ${DEPLOY_SHA::7}."
          elif git merge-base --is-ancestor "$DEPLOY_SHA" "$running"; then
            echo "The app runs ${running::7}, which is ${DEPLOY_SHA::7} or newer: nothing deployed."
            deploy=false
          else
            echo "The app runs ${running::7}, which doesn't include ${DEPLOY_SHA::7}: deploying."
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Log in to Fly registry
        if: steps.guard.outputs.deploy == 'true'
        run: echo "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and push
        if: steps.guard.outputs.deploy == 'true'
        run: |
          SHORT_SHA="${DEPLOY_SHA::7}"
          docker build --platform linux/amd64 \
            -t registry.fly.io/sky-justin:main \
            -t "registry.fly.io/sky-justin:sha-${SHORT_SHA}" .
          docker push registry.fly.io/sky-justin:main
          docker push "registry.fly.io/sky-justin:sha-${SHORT_SHA}"
      # holds new launches and waits for the runs in flight, so the restart doesn't cut one off; the
      # held launches start on the new API's boot. Only runs that outlast the wait stop the deploy: an API
      # that can't be reached or errors at the start, or that never answers a check once the drain is on
      # (nothing is known of its runs, and a broken API is what a fix is for), doesn't. Once drained, a
      # fresh 15-minute deadline covers the deploy; a failed or cancelled run ends the drain. Like the
      # deploy, these steps run only when the guard above lets the deploy go ahead
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.deploy == 'true'
        with:
          node-version: 24
      - name: Drain the live API
        id: drain
        if: steps.guard.outputs.deploy == 'true'
        # the hour-long wait, plus up to 30 s each for an in-flight poll and the refresh or cancel
        timeout-minutes: 70
        run: |
          if [ -z "$SKY_API_KEY" ]; then
            echo "SKY_ADMIN_KEY is not set; deploying without a drain"
            exit 0
          fi
          # the CLI of the commit being deployed, from the image just built: nothing downloaded runs
          # beside the admin key, and the API isn't built twice
          cid=$(docker create --platform linux/amd64 "registry.fly.io/sky-justin:sha-${DEPLOY_SHA::7}") || cid=
          if [ -z "$cid" ] || ! docker cp "$cid:/app/bundle/sky.mjs" "$RUNNER_TEMP/sky.mjs"; then
            [ -z "$cid" ] || docker rm "$cid" > /dev/null || true
            echo "could not take the CLI from the image; deploying without a drain"
            exit 0
          fi
          # cleanup only: a failed removal never fails the step
          docker rm "$cid" > /dev/null || true
          status=0
          node "$RUNNER_TEMP/sky.mjs" admin drain --wait --timeout=3600 || status=$?
          case "$status" in
            0)
              echo "the live API is drained"
              # the wait and the drain share one deadline, so what is left of it may not cover the
              # deploy; a drain ending mid-deploy releases every held launch just before the restart
              if ! node "$RUNNER_TEMP/sky.mjs" admin drain --timeout=900; then
                echo "::warning::could not extend the drain to cover the deploy; deploying anyway"
              fi
              ;;
            4)
              echo "::error::runs were still active when the drain's hour ran out; not deploying"
              node "$RUNNER_TEMP/sky.mjs" admin drain --cancel || true
              exit 1
              ;;
            *)
              echo "the drain could not be started, or the API stopped answering during it (exit $status); deploying anyway"
              ;;
          esac
        env:
          SKY_URL: https://sky-justin.fly.dev
          SKY_API_KEY: ${{ secrets.SKY_ADMIN_KEY }}
      - name: Deploy to Fly
        if: steps.guard.outputs.deploy == 'true'
        run: flyctl deploy -a sky-justin --image "registry.fly.io/sky-justin:sha-${DEPLOY_SHA::7}" --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # a successful deploy needs no cancel: the new API releases held launches on boot
      - name: End the drain
        if: (failure() || cancelled()) && steps.guard.outputs.deploy == 'true' && steps.drain.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [ ! -f "$RUNNER_TEMP/sky.mjs" ]; then
            exit 0
          fi
          node "$RUNNER_TEMP/sky.mjs" admin drain --cancel \
            || echo "::warning::could not end the drain; new launches stay held until its deadline"
        env:
          SKY_URL: https://sky-justin.fly.dev
          SKY_API_KEY: ${{ secrets.SKY_ADMIN_KEY }}
