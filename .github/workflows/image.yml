name: Image

on:
  # deploys a main commit only after CI has passed on it
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # a manual run redeploys main's tip as it stands, without checking its CI
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # repeats the job's `if:`: the group binds before it, and under workflow_run github.ref is always main, so a
  # failed, cancelled or pull-request CI run would otherwise join deploy-sky and cancel the deploy pending there
  group: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'deploy-sky' || github.run_id }}
  cancel-in-progress: false

jobs:
  image:
    # deploys prod and pushes the hardcoded :main tag, so a pull request's CI run, a failed CI run and a
    # manual run from another branch must not get this far
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # the commit CI checked, not whatever main points at when this run starts
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Log in to Fly registry
        run: echo "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and push
        run: |
          SHORT_SHA="${DEPLOY_SHA::7}"
          docker build --platform linux/amd64 \
            -t registry.fly.io/sky-justin:main \
            -t "registry.fly.io/sky-justin:sha-${SHORT_SHA}" .
          docker push registry.fly.io/sky-justin:main
          docker push "registry.fly.io/sky-justin:sha-${SHORT_SHA}"
      # holds new launches and waits for the runs in flight, so the restart doesn't cut one off; the
      # held launches start on the new API's boot. Only a drain that times out stops the deploy: an API
      # that can't be reached (the first deploy, or one that is down) is no reason to hold back a fix.
      # Once drained, a fresh 15-minute deadline covers the deploy; a failed or cancelled run ends the drain
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Drain the live API
        id: drain
        # the hour-long wait, plus up to 30 s each for the CLI fetch, an in-flight poll and the refresh or cancel
        timeout-minutes: 70
        run: |
          if [ -z "$SKY_API_KEY" ]; then
            echo "SKY_ADMIN_KEY is not set; deploying without a drain"
            exit 0
          fi
          if ! curl -fsS --max-time 30 -o "$RUNNER_TEMP/sky.mjs" "$SKY_URL/cli/sky.mjs"; then
            echo "could not fetch the CLI from $SKY_URL; deploying without a drain"
            exit 0
          fi
          status=0
          node "$RUNNER_TEMP/sky.mjs" admin drain --wait --timeout=3600 || status=$?
          case "$status" in
            0)
              echo "the live API is drained"
              # the wait and the drain share one deadline, so what is left of it may not cover the
              # deploy; a drain ending mid-deploy releases every held launch just before the restart
              if ! node "$RUNNER_TEMP/sky.mjs" admin drain --timeout=900; then
                echo "::warning::could not extend the drain to cover the deploy; deploying anyway"
              fi
              ;;
            4)
              echo "::error::runs were still active when the drain timed out; not deploying"
              node "$RUNNER_TEMP/sky.mjs" admin drain --cancel || true
              exit 1
              ;;
            *)
              echo "the drain could not be started or watched (exit $status); deploying anyway"
              ;;
          esac
        env:
          SKY_URL: https://sky-justin.fly.dev
          SKY_API_KEY: ${{ secrets.SKY_ADMIN_KEY }}
      - name: Deploy to Fly
        run: flyctl deploy -a sky-justin --image "registry.fly.io/sky-justin:sha-${DEPLOY_SHA::7}" --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # a successful deploy needs no cancel: the new API releases held launches on boot
      - name: End the drain
        if: (failure() || cancelled()) && steps.drain.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          if [ ! -f "$RUNNER_TEMP/sky.mjs" ]; then
            exit 0
          fi
          node "$RUNNER_TEMP/sky.mjs" admin drain --cancel \
            || echo "::warning::could not end the drain; new launches stay held until its deadline"
        env:
          SKY_URL: https://sky-justin.fly.dev
          SKY_API_KEY: ${{ secrets.SKY_ADMIN_KEY }}
