<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #16181d;
    }
    #many-grid {
      position: absolute;
      inset: 0;
    }
    .lab {
      position: absolute;
      left: 0;
      right: 0;
      top: 920px;
      text-align: center;
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 44px;
    }
    #many-lab-p {
      color: #9a9a9a;
    }
    #many-lab-a {
      color: #f7f6f2;
    }
    .many-tile {
      position: absolute;
      width: 240px;
      height: 150px;
      border-radius: 28px;
      background: #2a2a2a;
      border: 2px solid #f7f6f2;
    }
    .many-glyph {
      position: absolute;
      left: 22px;
      top: 20px;
      width: 36px;
      height: 36px;
    }
    .many-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .many-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f7f6f2;
    }
    .many-wait {
      position: absolute;
      top: 518px;
      width: 120px;
      height: 44px;
      border-radius: 12px;
      border: 3px solid #5e5e5e;
      background: #2a2a2a;
    }
    #many-solo {
      position: absolute;
      left: 1240px;
      top: 465px;
      width: 240px;
      height: 150px;
      border-radius: 28px;
      background: #2a2a2a;
      border: 2px solid #9a9a9a;
    }
    #many-solo-dot {
      position: absolute;
      left: 109px;
      bottom: 26px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #9a9a9a;
    }
  </style>
  <div id="root" data-composition-id="many" data-width="1920" data-height="1080">
    <div id="many-queue"></div>
    <div id="many-solo"><div id="many-solo-dot"></div></div>
    <div id="many-grid"></div>
    <div id="many-lab-p" class="lab">One at a time</div>
    <div id="many-lab-a" class="lab">Many repos at once</div>
  </div>
  <script>
    // 19 environments: rows of 5, 5, 5, 4; agent counts per environment are illustrative
    const agents = [3, 2, 4, 1, 3, 2, 4, 2, 1, 3, 4, 2, 3, 1, 2, 4, 3, 2, 1];
    const grid = document.getElementById("many-grid");
    const glyph =
      '<svg class="many-glyph" viewBox="0 0 36 36" fill="none" stroke="#f7f6f2" stroke-width="3" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><circle cx="9" cy="28" r="4"/><circle cx="27" cy="14" r="4"/><path d="M9 12V24M27 18Q27 24 9 24"/></svg>';
    for (let i = 0; i < 19; i++) {
      const row = Math.floor(i / 5);
      const col = i % 5;
      const inRow = row === 3 ? 4 : 5;
      const x = (1920 - (inRow * 240 + (inRow - 1) * 40)) / 2 + col * 280;
      const y = 120 + row * 186;
      const tile = document.createElement("div");
      tile.className = "many-tile";
      tile.id = `many-t${i}`;
      tile.style.left = `${x}px`;
      tile.style.top = `${y}px`;
      const dots = Array.from({ length: agents[i] }, (_, d) => `<div class="many-dot" id="many-d${i}-${d}"></div>`).join("");
      tile.innerHTML = `${glyph}<div class="many-dots">${dots}</div>`;
      grid.appendChild(tile);
    }
    // a single queue waiting on one worker
    const queue = document.getElementById("many-queue");
    for (let q = 0; q < 6; q++) {
      const chip = document.createElement("div");
      chip.className = "many-wait";
      chip.id = `many-w${q}`;
      chip.style.left = `${1060 - q * 150}px`;
      queue.appendChild(chip);
    }

    const tl = gsap.timeline({ paused: true });
    // problem: one environment, one agent, a queue of work waiting behind it
    tl.fromTo("#many-solo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
    tl.fromTo("#many-solo-dot", { opacity: 0.3 }, { opacity: 1, duration: 0.3, repeat: 3, yoyo: true }, 0.3);
    for (let q = 0; q < 6; q++) {
      tl.fromTo(`#many-w${q}`, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.2 + q * 0.12);
    }
    tl.fromTo("#many-lab-p", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4);

    // answer: one environment per repo, agents working at once
    tl.to(["#many-queue", "#many-solo"], { opacity: 0, duration: 0.3 }, 1.9);
    tl.to("#many-lab-p", { opacity: 0, duration: 0.25 }, 1.9);
    tl.fromTo("#many-lab-a", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.2);
    for (let i = 0; i < 19; i++) {
      tl.fromTo(`#many-t${i}`, { opacity: 0, scale: 0.7, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 2.0 + i * 0.06);
      for (let d = 0; d < agents[i]; d++) {
        const start = 2.9 + ((i * 3 + d * 5) % 7) * 0.08;
        tl.fromTo(`#many-d${i}-${d}`, { opacity: 0.25, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "sine.inOut", repeat: 3, yoyo: true }, start);
      }
    }
    tl.to("#root", { opacity: 0, duration: 0.3, ease: "power1.in" }, 4.2);
    window.__timelines["many"] = tl;
  </script>
</template>
