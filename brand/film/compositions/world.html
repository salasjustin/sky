  <script>
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const NS = "http://www.w3.org/2000/svg";

    // ---- builders -------------------------------------------------------
    const place = (sel, left, top) => {
      const el = $(sel);
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
    };
    // far and mid layers are positioned so each item shows at (sx, sy) when the camera is at (cx, cy)
    const par = (sel, f, sx, sy, cx, cy, w, h) => place(sel, sx + f * (cx - 960) - w / 2, sy + f * (cy - 540) - h / 2);
    par("#sun", 0.15, 960, 540, 960, -5600, 1400, 1400);
    par("#haze0", 0.15, 960, 700, 960, -900, 2600, 220);
    par("#haze1", 0.15, 960, 560, 960, -2800, 2600, 260);
    par("#haze2", 0.15, 960, 540, 960, -4300, 2600, 240);
    par("#rack0", 0.5, 300, 540, 960, -1800, 300, 420);
    par("#rack1", 0.5, 1620, 600, 960, -2000, 360, 520);
    par("#rack2", 0.5, 560, 300, 960, -3000, 280, 380);
    par("#rack3", 0.5, 1500, 500, 960, -3300, 340, 480);
    par("#fg0", 1.5, 200, 420, 960, -1400, 520, 520);
    par("#fg1", 1.5, 1750, 640, 960, -1900, 640, 640);
    par("#fg2", 1.5, 1300, 300, 960, -3000, 460, 460);

    // fan blades
    const fanRot = $("#fan-rot");
    for (let b = 0; b < 6; b++) {
      const blade = document.createElement("div");
      blade.className = "a";
      blade.style.cssText = `left:-22px;top:-130px;width:44px;height:110px;border-radius:22px 22px 8px 8px;background:linear-gradient(180deg,#9a9a9a,#5e5e5e);transform-origin:22px 130px;transform:rotate(${b * 60}deg)`;
      fanRot.appendChild(blade);
    }
    // meter bars
    const bars = $("#bars");
    for (let i = 0; i < 6; i++) {
      const track = document.createElement("div");
      track.className = "a";
      track.style.cssText = `left:${i * 42}px;top:0;width:30px;height:270px;border-radius:15px;background:#16181d`;
      const fill = document.createElement("div");
      fill.id = `bar${i}`;
      fill.className = "a";
      fill.style.cssText = `left:${i * 42}px;bottom:0;width:30px;height:20px;border-radius:15px;background:linear-gradient(180deg,#f7f6f2,#9a9a9a)`;
      bars.appendChild(track);
      bars.appendChild(fill);
    }
    // receipt rows
    const rc = $("#rc");
    for (let r = 0; r < 14; r++) {
      const row = document.createElement("div");
      row.className = "a";
      row.style.cssText = `left:24px;top:${28 + r * 34}px;width:${70 + ((r * 37) % 70)}px;height:9px;border-radius:5px;background:#9a9a9a`;
      const amt = document.createElement("div");
      amt.className = "a";
      amt.style.cssText = `right:24px;top:${28 + r * 34}px;width:30px;height:9px;border-radius:5px;background:#5e5e5e`;
      rc.appendChild(row);
      rc.appendChild(amt);
    }
    // branch nodes inside the hero sandbox
    const nodesHost = $("#nodes");
    const NODE_X = [140, 260, 380, 500, 620, 700];
    NODE_X.forEach((x, i) => {
      const n = document.createElement("div");
      n.id = `node${i}`;
      n.className = "a";
      const last = i === NODE_X.length - 1;
      n.style.cssText = `left:${x - (last ? 22 : 14)}px;top:${254 - (last ? 22 : 14)}px;width:${last ? 44 : 28}px;height:${last ? 44 : 28}px;border-radius:50%;background:#16181d;border:4px solid ${last ? "#f7f6f2" : "#5e5e5e"}`;
      nodesHost.appendChild(n);
    });
    // grid of environments: 5 columns, 4 rows, hero is column 2 row 1
    const tileHost = $("#tiles");
    const TILE = [];
    const AGENTS = [3, 2, 1, 4, 2, 3, 1, 2, 3, 2, 0, 4, 3, 1, 2, 2, 4, 1, 3, 2];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 5; c++) {
        // 20 slots less the hero (drawn separately) and one empty corner: 19 environments in all
        if ((c === 2 && r === 1) || (c === 4 && r === 3)) continue;
        const idx = TILE.length;
        const cx = 960 + (c - 2) * 1000;
        const cy = -2200 + (r - 1) * 800;
        const t = document.createElement("div");
        t.id = `tile${idx}`;
        t.className = "a glass";
        t.style.cssText = `left:${cx - 380}px;top:${cy - 260}px;width:760px;height:520px;border-radius:40px;opacity:0`;
        let inner = `<div class="a" style="left:40px;top:250px;width:680px;height:8px;border-radius:4px;background:#3a3d44"></div>`;
        for (let k = 0; k < 4; k++) inner += `<div class="a" style="left:${126 + k * 130}px;top:240px;width:28px;height:28px;border-radius:50%;background:#16181d;border:4px solid #9a9a9a"></div>`;
        const n = AGENTS[idx] || 1;
        for (let k = 0; k < n; k++) inner += `<div id="to${idx}-${k}" class="a" style="left:${150 + k * 150}px;top:${222 + (k % 2) * 8}px;width:44px;height:44px;border-radius:50%;background:#f7f6f2;box-shadow:0 0 50px rgba(247,246,242,0.6)"></div>`;
        t.innerHTML = inner;
        tileHost.appendChild(t);
        const card = document.createElement("div");
        card.id = `tcard${idx}`;
        card.className = "a";
        card.style.cssText = `left:${cx - 180}px;top:${cy - 520}px;width:360px;height:200px;border-radius:24px;background:linear-gradient(180deg,#2b2e36,#23262d);border:1px solid #454851;box-shadow:0 24px 60px rgba(0,0,0,0.55);opacity:0`;
        card.innerHTML = `<div class="a dimskel" style="left:24px;top:60px;width:300px"></div><div class="a skel" style="left:24px;top:60px;width:200px"></div><div class="a skel" style="left:24px;top:100px;width:120px"></div>`;
        tileHost.appendChild(card);
        TILE.push({ idx, cx, cy, c, r });
      }
    }
    // queue of waiting cards above the hero sandbox
    const qHost = $("#queue");
    for (let q = 0; q < 3; q++) {
      const card = document.createElement("div");
      card.id = `q${q}`;
      card.className = "a";
      card.style.cssText = `left:780px;top:${-3000 - q * 220}px;width:360px;height:200px;border-radius:24px;background:linear-gradient(180deg,#2b2e36,#23262d);border:1px solid #454851;opacity:0`;
      card.innerHTML = `<div class="a dimskel" style="left:24px;top:60px;width:300px"></div><div class="a skel" style="left:24px;top:60px;width:200px;background:#5e5e5e"></div><div class="a skel" style="left:24px;top:100px;width:120px;background:#5e5e5e"></div>`;
      qHost.appendChild(card);
    }
    // 82 merged pull requests: 10 columns, 8 full rows then 2
    const dotHost = $("#dots");
    for (let d = 0; d < 82; d++) {
      const dot = document.createElement("div");
      dot.id = `d${d}`;
      dot.className = "a";
      dot.style.cssText = `left:${375 + (d % 10) * 130 - 36}px;top:${-4900 + Math.floor(d / 10) * 130 - 36}px;width:72px;height:72px;border-radius:50%;background:#f7f6f2;box-shadow:0 0 40px rgba(247,246,242,0.45);opacity:0.14`;
      dotHost.appendChild(dot);
    }

    // ---- camera ---------------------------------------------------------
    const LAYERS = [
      { sel: "#L-far", f: 0.15, fs: 0.3 },
      { sel: "#L-mid", f: 0.5, fs: 0.65 },
      { sel: "#L-main", f: 1, fs: 1 },
      { sel: "#L-fg", f: 1.5, fs: 1.3 },
    ];
    const camState = (cx, cy, s) =>
      LAYERS.map((l) => {
        const sl = 1 + (s - 1) * l.fs;
        return { sel: l.sel, x: -sl * l.f * (cx - 960), y: -sl * l.f * (cy - 540), scale: sl };
      });
    const camSet = (cx, cy, s) => camState(cx, cy, s).forEach((c) => {
        tl.set(c.sel, { x: c.x, y: c.y, scale: c.scale }, 0);
      });
    const camTo = (at, dur, cx, cy, s, ease, from) => {
      const a = camState(from[0], from[1], from[2]);
      camState(cx, cy, s).forEach((c, i) => {
        tl.fromTo(c.sel, { x: a[i].x, y: a[i].y, scale: a[i].scale }, { x: c.x, y: c.y, scale: c.scale, duration: dur, ease, immediateRender: false }, at);
      });
    };
    let cur = [960, 480, 1.35];
    camSet(...cur);
    const move = (at, dur, cx, cy, s, ease = "power2.inOut") => {
      camTo(at, dur, cx, cy, s, ease, cur);
      cur = [cx, cy, s];
    };

    // ---- 0 – 2.4  typing ------------------------------------------------
    const tick = (el, w, at) => tl.set(el, { width: w }, at);
    for (let i = 0; i < 5; i++) tick("#ln0", 240 + i * 60, 0.2 + i * 0.12);
    for (let i = 0; i < 6; i++) tick("#ln1", 55 * (i + 1), 0.95 + i * 0.12);
    for (let i = 0; i < 3; i++) tick("#ln2", 60 * (i + 1), 1.7 + i * 0.12);
    tl.fromTo("#send", { scale: 1 }, { scale: 0.88, duration: 0.07, ease: "power2.in", immediateRender: false }, 2.35);
    tl.to("#send", { scale: 1, boxShadow: "0 0 60px rgba(247,246,242,0.9)", duration: 0.25, ease: "power2.out" }, 2.42);
    move(2.3, 0.8, 960, 540, 1.0);
    // the prompt becomes a card
    tl.fromTo("#pw", { scale: 1 }, { scale: 0.62, y: 30, duration: 0.5, ease: "back.out(1.4)", immediateRender: false }, 2.5);
    tl.fromTo("#spin", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 3.0);
    tl.fromTo("#spin", { rotation: 0 }, { rotation: 3000, duration: 4.4, ease: "none", immediateRender: false }, 3.0);
    tl.to("#spin", { opacity: 0, duration: 0.2 }, 7.3);

    // ---- 3 – 7.3  the laptop strains ------------------------------------
    tl.fromTo("#fan-rot", { rotation: 0 }, { rotation: 1500, duration: 4.3, ease: "power2.in", immediateRender: false }, 3.0);
    tl.fromTo("#fan-rot", { rotation: 1500 }, { rotation: 1920, duration: 1.3, ease: "power1.out", immediateRender: false }, 7.3);
    for (let i = 0; i < 6; i++) {
      tl.fromTo(`#bar${i}`, { height: 20 }, { height: 215 + (i % 3) * 20, duration: 0.8 + i * 0.1, ease: "power2.in", immediateRender: false }, 3.0);
      tl.fromTo(`#bar${i}`, { height: 215 + (i % 3) * 20 }, { height: 262, duration: 0.09, repeat: 9, yoyo: true, ease: "none", immediateRender: false }, 4.1 + i * 0.05);
      tl.to(`#bar${i}`, { height: 20, duration: 0.8, ease: "power2.out" }, 7.45 + i * 0.05);
    }
    tl.fromTo("#rc", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 4.2, ease: "steps(18)", immediateRender: false }, 3.1);
    tl.fromTo("#heat", { opacity: 0 }, { opacity: 1, duration: 3.5, ease: "power2.in", immediateRender: false }, 3.2);
    tl.fromTo("#scr-flick", { opacity: 0 }, { opacity: 0.16, duration: 0.06, repeat: 13, yoyo: true, ease: "none", immediateRender: false }, 4.6);
    tl.fromTo("#desk", { x: 0 }, { x: 5, duration: 0.05, repeat: 79, yoyo: true, ease: "none", immediateRender: false }, 3.4);
    tl.fromTo("#pw", { rotation: -1.2 }, { rotation: 1.2, duration: 0.06, repeat: 59, yoyo: true, ease: "none", immediateRender: false }, 3.4);
    move(3.3, 0.7, 420, 600, 1.4);
    move(4.4, 0.6, 1650, 440, 1.35);
    move(5.5, 0.6, 1650, 800, 1.4);
    move(6.5, 0.6, 960, 540, 1.0);

    // ---- 7.2 – 10.8  the card is handed up into Sky --------------------
    tl.fromTo("#cursor", { opacity: 0, x: 1180, y: 700 }, { opacity: 1, x: 1020, y: 470, duration: 0.35, ease: "power2.out", immediateRender: false }, 6.85);
    tl.fromTo("#cursor", { scale: 1 }, { scale: 0.85, duration: 0.07, immediateRender: false }, 7.22);
    tl.to("#cursor", { scale: 1, duration: 0.1 }, 7.3);
    // the card rises with the cursor, then the cursor lets go
    tl.fromTo("#pw", { y: 30, rotation: 0 }, { y: -3100, rotation: 0, duration: 2.7, ease: "power3.inOut", immediateRender: false }, 7.35);
    tl.fromTo("#cursor", { y: 470 }, { y: -2660, duration: 2.7, ease: "power3.inOut", immediateRender: false }, 7.35);
    tl.to("#cursor", { opacity: 0, duration: 0.3 }, 8.3);
    tl.to("#heat", { opacity: 0, duration: 0.3 }, 7.3);
